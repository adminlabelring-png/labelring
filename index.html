    <script type="text/javascript">
      // Syncs the .dark class (index.css's dark palette, incl. the logo
      // wordmark's color) to the OS/browser color-scheme preference, and
      // keeps it in sync if that preference changes while the tab is open.
      // Runs before first paint to avoid a flash of the wrong theme.
      (function () {
        var media = window.matchMedia("(prefers-color-scheme: dark)");
        var apply = function (isDark) {
          document.documentElement.classList.toggle("dark", isDark);
        };
        apply(media.matches);
        media.addEventListener("change", function (e) {
          apply(e.matches);
        });
      })();
    </script>

    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Decodes the redirect from 404.html back into the real path via
      // history.replaceState, before React Router reads window.location.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
